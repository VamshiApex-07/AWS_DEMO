name: deploy to ec2
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: deploy via ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          username: ubuntu
          key: ${{secrets.SSH_KEY}}
          script: |
            cd ~/AWS_DEMO
            git pull
            sudo docker stop aws_demo_container || true
            sudo docker rm aws_demo_container || true
            sudo docker build -t aws_demo .
            sudo docker run -it -d --name aws_demo_container -p 5000:5000 aws_demo
